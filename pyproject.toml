[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neocortex"
version = "0.1.0"
description = "MCP server providing structured long-term memory for AI agents via PostgreSQL knowledge graph"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[google,openai,anthropic]>=1.72.0",
    "loguru>=0.7.3",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastmcp>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "textual>=3.0",
    "click>=8.0",
    "procrastinate[psycopg]>=3.7.2",
    "psycopg[binary]>=3.3.3",
    "open-agent-compiler>=0.1.2",
    "httpx>=0.27.0",
    "feedparser>=6.0.12",
]

[dependency-groups]
dev = [
    "ty",
    "ruff",
    "pre-commit",
    "black",
    "flake8",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# Override global exclude-newer (from ~/.config/uv/uv.toml) which filters out
# recently-published packages needed by this project.
exclude-newer = "2100-01-01T00:00:00Z"

[project.scripts]
neocortex-tui = "neocortex.tui.__main__:main"

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.poetry]
packages = [{include = "pydantic_agents_playground", from = "src"}, {include = "neocortex", from = "src"}]

[tool.poetry.group.dev.dependencies]
black = "*"
flake8 = "*"
pre-commit = "*"
pytest = "*"
ruff = "*"
ty = "*"
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
# Sample agent scripts, not part of the server; already excluded from the type
# checker below.  Keeps `ruff check .` a usable gate for the code we own.
exclude = ["test_agents"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ty.src]
exclude = ["test_agents"]

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
